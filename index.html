
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d14">
<title>主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ccircle%20cx='50'%20cy='50'%20r='44'%20fill='none'%20stroke='%23e63946'%20stroke-width='7'/%3E%3Ctext%20x='50'%20y='50'%20text-anchor='middle'%20dominant-baseline='central'%20font-family='STXingkai%2CXingkai%20SC%2CSTKaiti%2CKaiTi%2Cserif'%20font-size='58'%20fill='%23111'%3E%E6%8B%BE%3C/text%3E%3C/svg%3E">

<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<link rel="stylesheet" href="assets/css/home/base.css?v=756095dc05">
<link rel="stylesheet" href="assets/css/home/layout.css?v=217991208d">
<link rel="stylesheet" href="assets/css/home/panel.css?v=2468d6ecc9">
<link rel="stylesheet" href="assets/css/home/extra.css?v=a00f566f0d">
</head>

<body>

  <div class="bg-wrap">
    <div class="bg-img" id="bgImg"></div>
    <div class="bg-overlay"></div>
  </div>

  <div class="app-container" id="appContainer">
    
    <div class="main-area" id="mainArea">
      <div class="content-wrap" id="contentWrap">
        
        
        <h1 class="clock" id="mainClock">
          <script>
            var d = new Date();
            document.write(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
          </script>
        </h1>
        
        <div class="date-area">
          <div class="date-line-1">
            <span id="dateMain">
              <script>
                var d = new Date();
                var weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
                document.write(d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + weekDays[d.getDay()]);
              </script>
            </span>
            <span id="dateLunar"></span>
            <span id="dateHoliday" class="date-holiday" style="display:none;"></span>
          </div>
          <div class="date-line-2" id="dateHuangli"></div>
        </div>

        <div class="dock" id="dock">
          
          <div class="tool-item" onclick="openPanel('clock', event)" title="时钟">
            <svg viewBox="0 0 100 100">
              <defs>
                <radialGradient id="dial-bg" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#2a2a2a"/><stop offset="85%" stop-color="#111"/><stop offset="100%" stop-color="#000"/>
                </radialGradient>
                <linearGradient id="dial-rim" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#f0f0f0"/><stop offset="50%" stop-color="#888"/><stop offset="100%" stop-color="#333"/>
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="48" fill="url(#dial-rim)"/>
              <circle cx="50" cy="50" r="43" fill="url(#dial-bg)"/>
              
              <g stroke="#888" stroke-width="1.5" stroke-linecap="round">
                <line x1="50" y1="10" x2="50" y2="15" stroke="#fff"/>
                <line x1="50" y1="90" x2="50" y2="85" stroke="#fff"/>
                <line x1="10" y1="50" x2="15" y2="50" stroke="#fff"/>
                <line x1="90" y1="50" x2="85" y2="50" stroke="#fff"/>
                <line x1="21.7" y1="21.7" x2="25.3" y2="25.3" stroke="#fff"/>
                <line x1="78.3" y1="78.3" x2="74.7" y2="74.7" stroke="#fff"/>
                <line x1="78.3" y1="21.7" x2="74.7" y2="25.3" stroke="#fff"/>
                <line x1="21.7" y1="78.3" x2="25.3" y2="74.7" stroke="#fff"/>
              </g>

              <g class="clock-hand-hour">
                <path d="M46 50 L50 22 L54 50 L50 55 Z" fill="#f0f0f0"/>
              </g>
              <g class="clock-hand-min">
                <path d="M48 50 L50 14 L52 50 L50 55 Z" fill="#fff"/>
              </g>
              <g class="clock-hand-sec">
                <line x1="50" y1="58" x2="50" y2="12" stroke="#e63946" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="50" cy="58" r="2.5" fill="#e63946"/>
              </g>
              
              <circle cx="50" cy="50" r="3.5" fill="#e63946"/>
              <circle cx="50" cy="50" r="1.5" fill="#fff"/>
            </svg>
          </div>

          
          <div class="tool-item" onclick="openPanel('calendar', event)" title="日历">
            <svg viewBox="0 0 100 100">
              <defs>
                <linearGradient id="cal-top" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ff5a5f"/><stop offset="100%" stop-color="#e63946"/>
                </linearGradient>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                </filter>
              </defs>
              <rect x="10" y="15" width="80" height="75" rx="10" fill="#fff" filter="url(#shadow)"/>
              <path d="M10 25 Q10 15 20 15 L80 15 Q90 15 90 25 L90 35 L10 35 Z" fill="url(#cal-top)"/>
              <rect x="25" y="8" width="8" height="16" rx="4" fill="#b0b0b0" stroke="#fff" stroke-width="1"/>
              <rect x="67" y="8" width="8" height="16" rx="4" fill="#b0b0b0" stroke="#fff" stroke-width="1"/>
              <text class="cal-svg-day" x="50" y="72" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="#e63946" text-anchor="middle">1</text>
            </svg>
          </div>

          
          <div class="tool-item" onclick="openPanel('weather', event)" title="天气">
            <svg viewBox="0 0 100 100">
              <defs>
                <linearGradient id="w-bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#f0f4f8"/><stop offset="100%" stop-color="#d9e2ec"/>
                </linearGradient>
              </defs>
              <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#w-bg)" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
              <path d="M35 60 Q25 60 25 50 Q25 40 35 40 Q40 30 55 30 Q70 30 75 45 Q85 45 85 55 Q85 65 75 65 L35 65 Z" fill="#4a5568"/>
              <circle cx="70" cy="40" r="10" fill="#f6ad55" opacity="0.8"/>
              <text id="svgWeatherTemp" x="75" y="82" font-family="Arial" font-weight="bold" font-size="18" fill="#4a5568" text-anchor="end">--°</text>
            </svg>
          </div>

          
          <a class="tool-item flat-icon" href="https://yuanhao-o.github.io/broadcast/" target="_blank" onclick="event.stopPropagation();" title="广播系统" style="text-decoration: none;">
            <svg viewBox="0 0 100 100">
              <defs>
                <linearGradient id="radio-body" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#e8dcc8"/><stop offset="100%" stop-color="#cdbca4"/>
                </linearGradient>
                <linearGradient id="radio-metal" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#999"/><stop offset="100%" stop-color="#444"/>
                </linearGradient>
              </defs>
              <rect x="10" y="30" width="80" height="50" rx="8" fill="url(#radio-body)" filter="url(#shadow)"/>
              <rect x="15" y="40" width="40" height="30" rx="4" fill="#3a2e20" opacity="0.8"/>
              <line x1="20" y1="55" x2="50" y2="55" stroke="#d4af37" stroke-width="2"/>
              <circle cx="70" cy="55" r="8" fill="url(#radio-metal)"/>
              <circle cx="70" cy="55" r="3" fill="#222"/>
              <circle cx="85" cy="55" r="5" fill="url(#radio-metal)"/>
              <line x1="30" y1="30" x2="15" y2="10" stroke="url(#radio-metal)" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </a>

          
          <div class="tool-item flat-icon" onclick="popEmojiAndChange(event)" title="Hi🥰">
            <span class="emoji-char" id="dockEmoji">😀</span>
          </div>
        </div>
      </div>
    </div>

    
    <div class="side-panel" id="sidePanel" onclick="event.stopPropagation()">
      <div class="panel-header">
        <h2 class="panel-title" id="panelTitle">功能</h2>
        <button class="panel-close" onclick="closePanel()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      
      <div class="panel-content" id="panel-clock">
        <div class="big-clock-display" id="bigClock" style="margin-top:2vh; margin-bottom: 4vh;">00:00:00</div>
        
        <div class="pomo-module">
          <div class="pomo-header">
            <span id="pomoPhaseText">专注时间</span>
            <button class="pomo-settings-btn" onclick="togglePomoSettings(event)" aria-label="设置">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>

          <div class="pomo-settings-pop" id="pomoSettingsPop">
            <label>专注: <input type="number" id="pomoFocusIn" min="1" max="90" value="25"> 分</label>
            <label>短休: <input type="number" id="pomoShortIn" min="1" max="30" value="5"> 分</label>
            <label>长休: <input type="number" id="pomoLongIn" min="1" max="60" value="15"> 分</label>
            <button onclick="savePomoSettings(event)">保存</button>
          </div>

          <div class="pomo-ring-wrap">
            <svg viewBox="0 0 100 100" class="pomo-ring-svg">
              <circle cx="50" cy="50" r="44" class="pomo-track"/>
              <circle cx="50" cy="50" r="44" class="pomo-bar" id="pomoProgressBar"/>
            </svg>
            <div class="pomo-time" id="pomoTimeText">25:00</div>
          </div>

          <div class="pomo-controls">
            <button class="pomo-btn" onclick="togglePomo(event)">
              <span id="pomoStartBtnText">开始</span>
            </button>
            <button class="pomo-btn" onclick="resetPomo(event)">重置</button>
          </div>
        </div>
      </div>

      
      <div class="panel-content" id="panel-calendar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <button onclick="changeMonth(-1)" style="background:none;border:none;color:var(--text);cursor:pointer;padding:8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          
          <div style="display:flex; align-items:center; gap:12px;">
            <h3 id="calMonthTitle" style="margin:0; font-size:clamp(1.1rem, 2.5vw, 1.3rem);">2026年 10月</h3>
            <button class="today-btn" onclick="goToToday()">今天</button>
          </div>

          <button onclick="changeMonth(1)" style="background:none;border:none;color:var(--text);cursor:pointer;padding:8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="calendar-header">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
      </div>

      
      <div class="panel-content" id="panel-weather">
        <div class="weather-search-container">
          <input type="text" id="cityInput" placeholder="搜索城市 (如: 上海)">
          <button onclick="searchCity()" aria-label="搜索">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          </button>
        </div>

        <div class="weather-hero">
          <div class="weather-hero-city" id="wCityName">定位中...</div>
          <div class="weather-hero-main">
            <div class="weather-hero-temp" id="wTemp">--°</div>
            <div style="display:flex; flex-direction:column;">
              <div class="weather-hero-desc" id="wDesc">-</div>
              <div style="font-size:0.9rem; color:var(--text-sub);" id="wFeelsLike">体感 --°</div>
            </div>
          </div>
        </div>

        <div class="weather-grid">
          <div class="weather-card">
            <div class="weather-card-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
              相对湿度
            </div>
            <div class="weather-card-value" id="wHumidity">--%</div>
          </div>
          <div class="weather-card">
            <div class="weather-card-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
              风速
            </div>
            <div class="weather-card-value" id="wWind">-- km/h</div>
          </div>
        </div>

        <div class="weather-forecast-title">未来 5 天</div>
        <div class="weather-forecast" id="wForecast"></div>
      </div>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="toast" id="toast">提示</div>

  <script src="assets/vendor/lunar-1.6.12.js?v=e92a6390a7" defer></script>

<script src="assets/js/home/app.js?v=5466cf13b9"></script>
</body>
</html>
